<div class="route-nav">
  <span><a href="/activities"> <i class="fa fa-home" aria-hidden="true"></i> Anasayfa </a></span> >
  <span><i class="fa fa-search" aria-hidden="true"></i> Kullanıcı ara </span>
</div>

<div class="p-grid p-nogutter p-justify-center p-align-center" style="height:100%">
    <div class="p-xl-6 p-lg-6 p-md-8 p-sm-12">
      <p-card>
        <div class="p-grid">
            
           
        
            <p class="birthday-header">
                <i class="fa fa-birthday-cake" aria-hidden="true"></i>   Mutlu Yıllar   <i class="fa fa-birthday-cake" aria-hidden="true"></i>
            </p>
            
          <div [hidden]="birthDayUsersHidden" class="p-grid p-col-12">
            <div class="profile-div  p-col-4 " (click)="routeProfile(user._id)" *ngFor="let user of birthDayUsers">   
              <div><img  class="birthday-users-pic-img img-thumbnail-custom " [src]="photoLinkCreate(user.fileLink)" alt="bekirbedir"  > </div>
              <div> @{{user.name}}</div>
            </div>
            </div>

            <div [hidden]="!birthDayUsersHidden" class="alert alert-warning w-100" role="alert">
                <p style="text-align:center">Bugün kimsenin doğum günü değilmiş <i class="fa fa-frown-o" aria-hidden="true"></i></p>
              </div>
            
         
        </div>
      </p-card>
    </div>
  </div>

<div class="p-grid p-nogutter p-justify-center p-align-center" style="height:100%">
  <div class="p-xl-6 p-lg-6 p-md-8 p-sm-12">
    <p-card>
      <div class="p-grid">
       
    
          <input type="text"  [(ngModel)]="search" (change)="searchFilter($event)" placeholder="Aramak için enter'a basın" class="btn search-button w-100">
            
        
     
          <div (click)="routeProfile(user._id)" class="p-col-12 profile-div" *ngFor="let user of users">
        <div class="p-grid">
          <div class="p-col-2">   
            <img  class="header-photo img-thumbnail" [src]="photoLinkCreate(user.fileLink)" alt="bekirbedir"  > 
          </div>
          <div class="p-col-10"> 
             <span class="approved-user">  @{{user.name}}  ({{user.username}})  </span>
             <br>
             <span><small>{{user.biography}}</small></span>
             
              <div class="p-grid">
              <ul  class="tag-list">
                <li *ngFor="let tag of user.tagList" class="profile-tag "><small> #{{tag}} </small></li>
              </ul>
            </div>
           
           </div>
          </div>
          </div>
       
      </div>
    </p-card>
  </div>
</div>
