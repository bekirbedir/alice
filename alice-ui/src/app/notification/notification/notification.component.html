<div class="route-nav">
  <span><a href="/activities"> <i class="fa fa-home" aria-hidden="true"></i> Anasayfa </a></span> >
  <span><i class="fa fa-comment" aria-hidden="true"></i> Hareketler </span>
</div> 
<div class="login-panel">

  <div class="p-grid p-nogutter p-justify-center p-align-center" style="height:100%">

    <div class="p-xl-4 p-lg-6 p-md-8 p-sm-10">


      <p-card>
        <p-header>
          Hareketler
        </p-header>
        <div class="p-col-12">

        </div>
        <div class="p-grid p-align-center">
          <div  *ngFor="let noti of notifications" class="notification-box">
            <p *ngIf="noti.type == 1" class="notification-row" [ngClass]="(!noti.isShow)?'bg-green':'my-class2'">
              <i class="fa fa-check" aria-hidden="true"> </i> <span class="notification-text"> {{noti.text}} </span>
              <small>Aktivite: <b>{{noti.activity.header}} </b> </small>
            </p>

            <p *ngIf="noti.type == 2"  class="notification-row" [ngClass]="(!noti.isShow)?'bg-green':'my-class2'">
              <i class="fa fa-sign-in" aria-hidden="true"> </i> <span class="notification-text"> {{noti.text}} </span>
              <br>
              <small>Aktivite: <b>{{noti.activity.header}} </b> </small>
              <br>
            <small>Kullanıcı:<b> {{noti.user.username +'( '+ noti.user.name + ' )'}}</b></small>
             </p>

             <p *ngIf="noti.type == 3"  class="notification-row" [ngClass]="(!noti.isShow)?'bg-green':'my-class2'">
              <i class="fa fa-commenting-o" aria-hidden="true"> </i><span class="notification-text"> {{noti.text}} </span>
               <br>
               <small>Aktivite: <b>{{noti.activity.header}} </b> </small>
               <br>
             <small><b> {{noti.user.username +' ( '+ noti.user.name + ' )'}}</b></small>
              </p>
          
          
          </div>

        </div>
       

      </p-card>

    </div>
  </div>
</div>
