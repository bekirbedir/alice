<div class="flex p-justify-center p-align-center page-container" style="height:100%">
  <div class="p-col-12 p-xl-5 p-lg-7 p-md-10 p-sm-12 page-content">
    <div class="message-list" > 
    <div class="theme-card">
      <div class="page-header" style="text-transform: capitalize;">{{activityStatic?.header}} - Etkinlik Duvarı <div class="sub-info-text">*Burada etkinlik hakkında konuşulur ve konuşma tüm katılımcılara açıktır</div></div>  
      <div>
        <div>
          <p-scrollPanel id="commentScroll" [style]="{width: '100%',height:'58vh'}">
            <div *ngIf="comments" class="comments">
              <div class="comment-box" *ngFor="let cmt of comments ; 
                let index =index;
                let isOdd=odd;
                let isEven=even"  [class.odd-border]="isOdd" 
                [class.even-border]="isEven">
                <span class="comment-text"> {{cmt.text}} </span> 
                <span class="comment-username">@{{cmt.username}} <span class="comment-date"> {{ cmt.createdDate | date:'dd/MM/yyyy HH:mm':null:'tr'}}</span></span>
              </div>
            </div>
          </p-scrollPanel>
        </div> 
      </div>
      <div class="p-grid">
        <div class="p-col-12">
          <h3 class="input-label"></h3>
          <span class="ui-float-label" style="margin-top:15px !important">
            <input id="float-input" type="text" size="50" pInputText [(ngModel)]="newComment.text"
              class="w-100">
            <label for="float-input">Etkinlik hakkında sorularını buraya yazabilirsin</label>
          </span>
        </div>
        <div class="p-col-12">
          <button type="button" (click)="sendComment()" class="btn primary-button w-100 ">Gönder</button>
        </div>
      </div>
    </div>
  </div>
  </div>
</div>
