<div class="login-panel">
  <p-toast position="top-center" key="tc"></p-toast>
    <div class="p-grid p-nogutter p-justify-center p-align-center" style="height:100%">
  
      <div class="p-xl-4 p-lg-6 p-md-8 p-sm-10">
        <p-card  >
          <p-header>
           Kayıt Ol
        </p-header>
          <div class="p-col-12">

          </div>
          <div class="p-grid p-align-center">
              

            
          <div class="p-col-12">
            <span class="ui-float-label" style="margin-top:15px !important">
              <input id="float-input" type="text" size="100" pInputText [(ngModel)]="user.name" class="w-100">
              <label for="float-input">Ad Soyad</label>
            </span>
          </div>

          <div class="p-col-12">
            <span class="ui-float-label" style="margin-top:15px !important">
              <input id="float-input" type="text" size="100" pInputText [(ngModel)]="user.email" class="w-100">
              <label for="float-input">Email adresi girin</label>
            </span>
          </div>
       
          <div class="p-col-12">
            <span class="ui-float-label" style="margin-top:15px !important">
              <p-inputMask id="float-input" mask="(999) 999-99-99" [(ngModel)]="user.phone" class="w-100" ></p-inputMask>
              <label for="float-input">Telefon numarası girin</label>
            </span>
          </div>

          <div class="p-col-12">
            <span class="ui-float-label" style="margin-top:15px !important">
              <input id="float-input" type="text" size="100" pInputText [(ngModel)]="user.username" class="w-100">
              <label for="float-input">Kullanıcı adı girin</label>
            </span>
          </div>

          <div class="p-col-12">
            <span class="ui-float-label" style="margin-top:15px !important">
              <input id="float-input" type="text" size="100" pInputText [(ngModel)]="user.password" class="w-100">
              <label for="float-input">Parola girin</label>
            </span>
          </div>

          <div class="p-col-12">
            <span class="ui-float-label" style="margin-top:15px !important">
              <textarea  id="input-bio" [rows]="6" class="w-100" pInputTextarea autoResize="autoResize" [(ngModel)]="user.biography"  ></textarea>
              <label for="float-input">Seni tanıyabilmemiz için biraz kendinden bahseder misin?</label>
            </span>
          </div>
       
          

            <div class="p-col-12"><p-checkbox [(ngModel)]="checked" label="Sözleşmeyi okudum ve kabul ediyorum." binary="true"></p-checkbox></div>
          
          </div>
          <div class="p-grid" >
           
            <div class="p-col-6">
              <button pButton type="button" label="Zaten üye misin ?" class="ui-button-raised  p-col-12 login-btn"
                (click)="routeLogin()"></button>
              </div>
              <div class="p-col-6">
              <button  [disabled]="!checked" (click)="createNewUser()" pButton type="button" label="Kayıt Ol »" class="ui-button-raised p-col-12"></button>
              </div>
          </div>
        </p-card>
        
      </div>
    </div>
  </div>
