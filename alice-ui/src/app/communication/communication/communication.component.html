<div class="flex p-justify-center p-align-center page-container" >
  <div class="p-col-12 p-xl-5 p-lg-7 p-md-10 p-sm-12 page-content">
    <div class="theme-card" style="padding: 1em; gap:0">
      <div class="page-header">Bize Mesaj Gönderin</div>
      <div class="p-col-12 mt-10">
        <span class="ui-float-label">
          <input id="float-input" type="text" size="100" pInputText [(ngModel)]="firstname" class="w-100">
          <label for="float-input">Ad</label>
        </span>
      </div>
      <div class="p-col-12">
        <span class="ui-float-label" >
          <input id="float-input" type="text" size="100" pInputText [(ngModel)]="lastname" class="w-100">
          <label for="float-input">Soyad</label>
        </span>
      </div>

      <div class="p-col-12">
        <span class="ui-float-label" >
          <input id="float-input" type="text" size="100" pInputText [(ngModel)]="eMail" class="w-100">
          <label for="float-input">Email</label>
        </span>
      </div>

      <div class="p-col-12">      
        <span class="ui-float-label">
          <input id="float-input" type="text" size="100" pInputText [(ngModel)]="phone" class="w-100">
          <label for="float-input">Telefon</label>
        </span>
      </div>

      <div class="p-col-12">
        <span class="ui-float-label">
            <textarea class="w-100" id="float-input" [rows]="10" [cols]="30" pInputTextarea autoResize="autoResize" [(ngModel)]="comment"></textarea>
          <label for="float-input">Mesajını buraya yaz</label>
        </span>
      </div>
      <div class="p-col-12">
        <script src="https://www.google.com/recaptcha/api.js?render=explicit&onload=initRecaptcha" async defer></script>
        <p-captcha siteKey="6LfbtNgZAAAAAHyU44M70pcVFzU360FOLWNfRzPr" (onResponse)="showResponse($event)"></p-captcha>
      </div>
      <div class="p-col-12">
        <button type="button" (click)="createInfo()" class="btn primary-button w-100"style="height: 50px;"[disabled]="sended">Gönder</button>
      </div> 
      <div class="text-center">
        <div class="w-100"><b>Bize Ulaşın</b></div>
        <div class="w-100"><a><i class="fa fa-envelope-o" aria-hidden="true"></i> info@activityfriend.com.tr</a></div>
        <div class="w-100"><i class="fa fa-instagram" aria-hidden="true"></i><a target="_blank" href="https://www.instagram.com/activityfriend"> activityfriend</a> </div>
      </div>
    </div>
  </div>
</div>

  <p-toast position="top-center" key="tc"></p-toast>
